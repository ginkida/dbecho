[databases.myapp]
url = "postgres://localhost:5432/myapp"
description = "Main application"

# Environment variables are supported with ${VAR} syntax:
# [databases.production]
# url = "${DATABASE_URL}"
# description = "Production database"

# Apps that keep tables outside public can set a schema (default: "public";
# lowercase identifier). Metadata tools (schema/describe/analyze/...) target
# it, and it leads search_path so raw queries can use unqualified table names:
# [databases.events]
# url = "postgres://localhost:5432/events"
# schema = "analytics"

[settings]
row_limit = 500          # max rows returned per query (default: 500)
query_timeout = 30       # seconds before a query is killed (default: 30)

# Tables with more rows than this are refused by analyze/anomalies
# (full-table profiling); use targeted queries instead. Default: 5_000_000.
# max_profile_rows = 5000000

# Replace values of sensitive-looking columns (password/token/secret/...)
# with "<redacted>" in query/sample/analyze output. Default: true.
# redact_sensitive = true
